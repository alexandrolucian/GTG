name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências e montar o app web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GTG-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GTG-apk
          path: GTG-v${{ github.run_number }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GTG v${{ github.run_number }}
          body: Baixe o arquivo .apk abaixo pelo celular e toque para instalar.
          files: GTG-v${{ github.run_number }}.apk
          make_latest: true
